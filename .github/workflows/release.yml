name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache Cargo artifacts without making rustc depend on the sccache service.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          shared-key: 'tauri-build'
          cache-on-failure: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: install frontend dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-firebase

      - name: Validate rules and regressions before publishing
        env:
          JAVA_TOOL_OPTIONS: '-Djdk.net.unixdomain.tmpdir=C:\CovoUnavailableUnixSocketDirectory'
        run: |
          npm run build:firebase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build Tailwind CSS
        run: node scripts/build_tailwind.mjs

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'Windows: download CovoSetup.exe. Signed updater artifacts are also attached for in-app updates.'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis -- --locked

      - name: Build Covo setup shell
        shell: pwsh
        run: ./scripts/build_windows_setup.ps1 -Bootstrap

      - name: Upload Covo setup shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          gh release upload "v$($config.version)" src-tauri/windows/bin/CovoSetup.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$($config.version)" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
