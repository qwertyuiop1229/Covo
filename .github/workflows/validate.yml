name: Validate Covo
on:
  pull_request:
  push:
    branches: ['main', 'master', 'codex/**']
permissions:
  contents: read
jobs:
  web-and-rules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: ./.github/actions/setup-firebase
      - run: npm run build:firebase
      - run: npm run test:security
        env:
          JAVA_TOOL_OPTIONS: '-Djdk.net.unixdomain.tmpdir=C:\CovoUnavailableUnixSocketDirectory'
      - run: npx playwright install chrome
      - run: npx playwright test
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: 'tauri-build'
          cache-on-failure: true
      - run: npm ci
      - run: ./scripts/prepare_windows.ps1
        shell: pwsh
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.validation.conf.json -- --locked
      - run: ./scripts/build_windows_setup.ps1 -Bootstrap
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Covo-setup-validation
          path: src-tauri/windows/bin/CovoSetup.exe
