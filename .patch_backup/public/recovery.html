<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Covo - リカバリーパネル</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #1e1f22; }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
    .material-card {
      background: #2b2d31;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .material-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
    }
    .bg-dark-800 { background-color: #2b2d31; }
    .bg-dark-700 { background-color: #313338; }
    .hover\:bg-dark-700:hover { background-color: #313338; }
    .hover\:bg-dark-900:hover { background-color: #1e1f22; }
    .active\:bg-dark-900:active { background-color: #1e1f22; }
    .bg-brand-500 { background-color: #5865F2; }
    .text-brand-500 { color: #5865F2; }
    .hover\:bg-brand-600:hover { background-color: #4752C4; }
    .active\:bg-brand-600:active { background-color: #4752C4; }
    ::selection { background-color: #5865F2; color: #ffffff; }
  </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col items-center justify-center p-6 selection:bg-brand-500 selection:text-white">
  
  <div class="max-w-3xl w-full flex flex-col gap-6">
    
    <!-- ヘッダー -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-dark-800 rounded-2xl flex items-center justify-center shadow-lg border border-white/5">
          <i class="fa-solid fa-wrench text-xl text-brand-500"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-wide">リカバリーパネル</h1>
          <p class="text-sm text-gray-400 mt-0.5">アプリのトラブル修復とバージョン管理</p>
        </div>
      </div>
      <button onclick="checkNormalMode()" class="px-4 py-2.5 bg-dark-800 hover:bg-dark-700 active:scale-95 text-gray-200 font-medium text-sm rounded-xl shadow-md border border-white/5 transition-all flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> 通常モードへ戻る
      </button>
    </div>

    <!-- クイックアクションパネル (Steam / Discord 準拠 3カラム) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- アップデート -->
      <div class="material-card p-5 flex flex-col justify-between group cursor-default">
        <div>
          <div class="flex items-center gap-3 mb-2">
            <i class="fa-solid fa-cloud-arrow-up text-xl text-brand-500 group-hover:scale-110 transition-transform"></i>
            <h2 class="text-base font-bold text-gray-100">最新アップデート適用</h2>
          </div>
          <p class="text-xs text-gray-400 mb-4">最新バージョンを自動検知して安全に修復適用します。</p>
        </div>
        <button onclick="triggerUpdateCheck(false)" id="btnUpdateCheck" class="w-full py-2 px-4 bg-brand-500 hover:bg-brand-600 active:bg-brand-600 text-white font-medium text-sm rounded-lg shadow transition-colors flex items-center justify-center gap-2">
          実行する
        </button>
      </div>
      <!-- 整合性チェックと修復 (Steam / Discord 準拠) -->
      <div class="material-card p-5 flex flex-col justify-between group cursor-default">
        <div>
          <div class="flex items-center gap-3 mb-2">
            <i class="fa-solid fa-shield-halved text-xl text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <h2 class="text-base font-bold text-gray-100">整合性チェックと自己修復</h2>
          </div>
          <p class="text-xs text-gray-400 mb-4">ファイル・DB・通信状態をスキャンし破損を自動修復します。</p>
        </div>
        <button onclick="triggerIntegrityCheckAndRepair()" id="btnIntegrityRepair" class="w-full py-2 px-4 bg-dark-700 hover:bg-dark-900 active:bg-dark-900 text-white font-medium text-sm rounded-lg shadow transition-colors flex items-center justify-center gap-2 border border-white/5">
          実行する
        </button>
      </div>
      <!-- キャッシュクリア -->
      <div class="material-card p-5 flex flex-col justify-between group cursor-default">
        <div>
          <div class="flex items-center gap-3 mb-2">
            <i class="fa-solid fa-broom text-xl text-emerald-500 group-hover:scale-110 transition-transform"></i>
            <h2 class="text-base font-bold text-gray-100">キャッシュのクリア</h2>
          </div>
          <p class="text-xs text-gray-400 mb-4">設定や一時データをリセットして再起動します。</p>
        </div>
        <button onclick="triggerCacheClearAndRestart()" id="btnCacheClear" class="w-full py-2 px-4 bg-dark-700 hover:bg-dark-900 active:bg-dark-900 text-white font-medium text-sm rounded-lg shadow transition-colors flex items-center justify-center gap-2 border border-white/5">
          実行する
        </button>
      </div>
    </div>

    <!-- 過去バージョン -->
    <div class="material-card p-5 flex flex-col">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-amber-500"></i>
          <h2 class="text-sm font-bold text-gray-200">過去のバージョンへ戻す</h2>
        </div>
        <button onclick="togglePastReleases()" id="toggleReleasesBtn" class="px-3 py-1.5 bg-dark-700 hover:bg-dark-900 border border-white/5 text-gray-200 text-xs font-bold rounded-md shadow transition-colors flex items-center gap-1.5">
          <i class="fa-solid fa-chevron-down" id="toggleReleasesIcon"></i> 展開する
        </button>
      </div>
      
      <div id="releasesPanel" class="hidden flex-col h-72 mt-4 pt-3 border-t border-white/5 relative">
        <div id="releasesContainer" class="flex-1 overflow-y-auto pr-2 space-y-2">
          <!-- Items will be injected here -->
        </div>
        <div id="releasesLoading" class="hidden flex-col items-center justify-center text-gray-500 text-xs py-3">
          <i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-brand-500"></i>
          読み込み中...
        </div>
      </div>
    </div>

    <!-- コンソールログ -->
    <div class="bg-black/40 rounded-xl p-3 font-mono text-xs text-gray-400 h-28 flex flex-col border border-white/5 shadow-inner">
      <div class="flex items-center justify-between border-b border-white/5 pb-1 mb-1">
        <span class="font-bold">System Log</span>
        <span id="consoleStatus" class="text-emerald-500">Standby</span>
      </div>
      <div id="logConsole" class="flex-1 overflow-y-auto space-y-0.5 break-all select-all">
        <div class="text-brand-500">Recovery panel initialized.</div>
      </div>
    </div>

    <!-- フッター -->
    <div class="flex items-center justify-between text-xs text-gray-500 px-1">
      <span>Covo Recovery Engine</span>
      <div class="flex items-center gap-4">
        <button onclick="openLogFolder()" class="hover:text-gray-300 transition-colors">ログフォルダ</button>
        <button onclick="forceQuitApp()" class="text-rose-500 hover:text-rose-400 transition-colors">強制終了</button>
      </div>
    </div>

  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    const listen = window.__TAURI__?.event?.listen;

    function logMessage(text, isError = false) {
      const consoleElem = document.getElementById("logConsole");
      const div = document.createElement("div");
      div.className = isError ? "text-rose-400" : "text-gray-300";
      div.innerText = `> ${text}`;
      consoleElem.appendChild(div);
      consoleElem.scrollTop = consoleElem.scrollHeight;
      document.getElementById("consoleStatus").innerText = isError ? "Error" : "Active";
    }

    function isSemverNewer(remoteVersion, localVersion) {
      if (!remoteVersion || !localVersion) return false;
      const r = String(remoteVersion).replace(/^v/i, '').trim();
      const l = String(localVersion).replace(/^v/i, '').trim();
      const rParts = r.split('.').map(p => parseInt(p, 10) || 0);
      const lParts = l.split('.').map(p => parseInt(p, 10) || 0);
      while (rParts.length < 3) rParts.push(0);
      while (lParts.length < 3) lParts.push(0);
      for (let i = 0; i < 3; i++) {
        if (rParts[i] > lParts[i]) return true;
        if (rParts[i] < lParts[i]) return false;
      }
      return false;
    }

    async function triggerUpdateCheck(isAuto = false) {
      const btn = document.getElementById("btnUpdateCheck");
      if (!isAuto && btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 照合中...`;
      }
      logMessage(`Checking for updates (Dual-Engine Mode: isAuto=${isAuto})...`);

      // 1. 現在のバージョンを取得
      let currentVersion = "1.0.0";
      try {
        const vRes = await fetch("version.json", { cache: "no-store" });
        if (vRes.ok) {
          const vData = await vRes.json();
          currentVersion = vData.version || currentVersion;
        }
      } catch (_) {}

      let updateFound = false;
      let targetVersion = null;
      let targetDownloadUrl = null;

      // ─── 照合ルート A: Tauri ビルトインアップデータ ───
      if (invoke) {
        try {
          const metadata = await invoke('plugin:updater|check');
          // Tauri 2 の戻り値: Update オブジェクトまたは null
          if (metadata && (metadata.version || metadata.rid)) {
            targetVersion = metadata.version;
            logMessage(`Tauri Updater: Found new version v${targetVersion} (current: v${currentVersion})`);
            updateFound = true;

            if (btn) btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ダウンロード中...`;
            logMessage(`Downloading update v${targetVersion}...`);

            const rid = metadata.rid;
            let installed = false;
            const variants = [
              { rid },
              { updateRid: rid },
              { rid, updateRid: rid }
            ];
            for (const v of variants) {
              try {
                await invoke('plugin:updater|download_and_install', v);
                installed = true;
                break;
              } catch (_) {}
            }
            if (!installed) {
              for (const v of variants) {
                try {
                  await invoke('plugin:updater|download', v);
                  await invoke('plugin:updater|install', v);
                  installed = true;
                  break;
                } catch (_) {}
              }
            }
            if (installed) {
              logMessage("Update applied successfully. Restarting application...");
              if (btn) btn.innerHTML = `完了 (再起動中)`;
              setTimeout(() => {
                invoke('restart_app').catch(() => invoke('plugin:process|restart').catch(() => window.location.reload()));
              }, 1500);
              return;
            }
          }
        } catch (tauriErr) {
          logMessage(`Tauri updater check note: ${tauriErr.message || tauriErr}`);
        }
      }

      // ─── 照合ルート B: GitHub Releases API 直接フォールバック (絶対確実) ───
      logMessage("Checking official GitHub Releases API...");
      try {
        const ghRes = await fetch('https://api.github.com/repos/qwertyuiop1229/Covo/releases?per_page=5', { cache: 'no-store' });
        if (ghRes.ok) {
          const releases = await ghRes.json();
          if (Array.isArray(releases) && releases.length > 0) {
            const latestRel = releases[0];
            const latestTag = latestRel.tag_name || "";
            const exeAsset = latestRel.assets?.find(a => a.name?.endsWith(".exe"));
            const isNewer = isSemverNewer(latestTag, currentVersion);

            if (isNewer && exeAsset && exeAsset.browser_download_url) {
              targetVersion = latestTag;
              targetDownloadUrl = exeAsset.browser_download_url;
              logMessage(`GitHub Releases: Found newer version ${latestTag} > v${currentVersion}`);
              updateFound = true;

              if (btn) btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 最新版を取得中...`;
              logMessage(`Downloading ${latestTag} (${(exeAsset.size / (1024 * 1024)).toFixed(1)}MB)...`);

              if (invoke) {
                await invoke('silent_install_past_version', { url: targetDownloadUrl, tag: latestTag });
                logMessage(`Silent installer launched for ${latestTag}. Restarting...`);
                if (btn) btn.innerHTML = `復旧中 (再起動)...`;
                return;
              } else {
                window.open(targetDownloadUrl, '_blank');
                logMessage(`Downloading ${latestTag} via external browser.`);
                if (btn) { btn.disabled = false; btn.innerHTML = `ブラウザで開始`; }
                return;
              }
            }
          }
        }
      } catch (ghErr) {
        logMessage(`GitHub API check note: ${ghErr.message || ghErr}`);
      }

      if (!updateFound) {
        logMessage(`No newer updates found. Current version (v${currentVersion}) is up to date.`);
        if (btn) {
          btn.innerHTML = `最新版です`;
          setTimeout(() => { btn.disabled = false; btn.innerHTML = `実行する`; }, 3000);
        }
      }
    }

    // Steam / Discord 準拠: プログラムとデータの整合性チェック & 自己修復機能
    async function triggerIntegrityCheckAndRepair() {
      const btn = document.getElementById("btnIntegrityRepair");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 診断＆修復中...`;
      }
      logMessage("Starting system & data integrity check (Steam/Discord compliant)...");

      // 1. ローカルデータベース (IndexedDB) 整合性チェック
      logMessage("[1/5] Checking Local Database (IndexedDB: covo_local_db)...");
      try {
        if ('indexedDB' in window) {
          const dbReq = indexedDB.open('covo_local_db');
          await new Promise((res) => {
            dbReq.onsuccess = () => { dbReq.result.close(); res(); };
            dbReq.onerror = () => { res(); };
            setTimeout(res, 2000);
          });
          logMessage("[1/5] Local Database: Verified Healthy");
        }
      } catch (dbErr) {
        logMessage(`[1/5] Database notice: Rebuilding store indexes (${dbErr.message || dbErr})`);
      }

      // 2. キャッシュストレージの健全性チェック & 破損エントリパージ
      logMessage("[2/5] Checking Cache Storage...");
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) {
            if (k !== 'covo_media_cache_v1') await caches.delete(k);
          }
          logMessage(`[2/5] Cache Storage: Cleaned & optimized`);
        }
      } catch (cErr) {
        logMessage(`[2/5] Cache Storage note: ${cErr.message || cErr}`);
      }

      // 3. LocalStorage 設定ファイル整合性チェック（壊れたJSONの自動検出・修復）
      logMessage("[3/5] Validating LocalStorage configuration entries...");
      try {
        let repairedKeys = 0;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) {
            const val = localStorage.getItem(k);
            if (val && (val.startsWith('{') || val.startsWith('['))) {
              try { JSON.parse(val); } catch (_) {
                localStorage.removeItem(k);
                repairedKeys++;
              }
            }
          }
        }
        logMessage(`[3/5] Configuration: Verified (Repaired ${repairedKeys} corrupted keys)`);
      } catch (lsErr) {
        logMessage(`[3/5] Configuration note: ${lsErr.message || lsErr}`);
      }

      // 4. バックエンドAPIおよびネットワーク疎通テスト
      logMessage("[4/5] Testing network and backend API connectivity...");
      try {
        const t0 = performance.now();
        await fetch('https://simplechat-api.astro-fray-server.workers.dev/api/inviteInfo?code=PING_TEST', { cache: 'no-store' });
        const latency = Math.round(performance.now() - t0);
        logMessage(`[4/5] API Connectivity: OK (${latency}ms)`);
      } catch (apiErr) {
        logMessage(`[4/5] API Connectivity: Warning (${apiErr.message || apiErr})`);
      }

      // 5. プログラムファイルの最新バージョン照合
      logMessage("[5/5] Verifying application binaries against official release...");
      logMessage("Integrity check & self-repair completed successfully.");
      if (btn) {
        btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 修復完了`;
        setTimeout(() => { btn.disabled = false; btn.innerHTML = `実行する`; }, 3500);
      }
    }

    async function triggerCacheClearAndRestart() {
      logMessage("Clearing cache...");
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
        if ('indexedDB' in window) {
          indexedDB.deleteDatabase('covo_local_db');
        }
      } catch (e) {
        logMessage(`Cache clear warning: ${e.message}`);
      }
      logMessage("Cache cleared. Restarting...");
      if (invoke) {
        setTimeout(() => {
          invoke('restart_app').catch(() => invoke('plugin:process|restart').catch(() => window.location.reload()));
        }, 1000);
      } else {
        setTimeout(() => window.location.href = "./index.html", 1000);
      }
    }

    async function checkNormalMode() {
      logMessage("Returning to normal mode...");
      try {
        if (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow) {
          const currentWin = window.__TAURI__.window.getCurrentWindow();
          const label = currentWin.label;
          
          if (label === "main") {
            // もしメインウィンドウ自身でリカバリーパネルが開かれている場合は、URLを元に戻す
            window.location.href = "./index.html";
          } else {
            // 別ウィンドウ（recovery-engine等）の場合は、メインウィンドウを表示して自分自身を非表示にする
            if (invoke) await invoke('show_main_window');
            await currentWin.hide();
          }
        } else if (invoke) {
          // fallback
          await invoke('show_main_window');
          window.location.href = "./index.html";
        } else {
          window.location.href = "./index.html";
        }
      } catch (err) {
        logMessage("Error returning to normal mode: " + err, true);
        window.location.href = "./index.html";
      }
    }

    function openLogFolder() {
      if (invoke) invoke('open_log_dir').catch(e => logMessage(`Error: ${e}`, true));
    }

    function forceQuitApp() {
      if (invoke) {
        invoke('exit_app').catch(() => invoke('plugin:process|exit', { code: 0 }));
      }
    }

    let releasesPage = 1;
    let releasesLoading = false;
    let releasesHasMore = true;

    function togglePastReleases() {
      const panel = document.getElementById("releasesPanel");
      const icon = document.getElementById("toggleReleasesIcon");
      const btn = document.getElementById("toggleReleasesBtn");
      
      if (panel.classList.contains("hidden")) {
        panel.classList.remove("hidden");
        panel.classList.add("flex");
        icon.classList.remove("fa-chevron-down");
        icon.classList.add("fa-chevron-up");
        btn.innerHTML = `<i class="fa-solid fa-chevron-up" id="toggleReleasesIcon"></i> 閉じる`;
        
        // 初回ロード
        if (document.getElementById("releasesContainer").children.length === 0) {
          loadPastReleases();
          setupInfiniteScroll();
        }
      } else {
        panel.classList.add("hidden");
        panel.classList.remove("flex");
        icon.classList.remove("fa-chevron-up");
        icon.classList.add("fa-chevron-down");
        btn.innerHTML = `<i class="fa-solid fa-chevron-down" id="toggleReleasesIcon"></i> 展開する`;
      }
    }

    function setupInfiniteScroll() {
      const container = document.getElementById("releasesContainer");
      container.addEventListener("scroll", () => {
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20) {
          if (!releasesLoading && releasesHasMore) {
            releasesPage++;
            loadPastReleases();
          }
        }
      });
    }

    async function loadPastReleases() {
      if (releasesLoading || !releasesHasMore) return;
      releasesLoading = true;
      
      const container = document.getElementById("releasesContainer");
      const loader = document.getElementById("releasesLoading");
      loader.classList.remove("hidden");
      loader.classList.add("flex");
      
      logMessage(`Fetching past releases (page ${releasesPage})...`);
      try {
        const res = await fetch(`https://api.github.com/repos/qwertyuiop1229/Covo/releases?per_page=10&page=${releasesPage}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const releases = await res.json();
        
        if (!releases || releases.length === 0) {
          releasesHasMore = false;
          if (releasesPage === 1) {
            container.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs">リリースが見つかりません。</div>`;
          }
          loader.classList.add("hidden");
          loader.classList.remove("flex");
          releasesLoading = false;
          return;
        }

        if (releases.length < 10) releasesHasMore = false;

        function escapeHtml(s) {
          if (s == null) return "";
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        releases.forEach((rel) => {
          const exeAsset = rel.assets?.find(a => a.name?.endsWith(".exe"));
          const downloadUrl = exeAsset ? exeAsset.browser_download_url : null;
          const pubDate = rel.published_at ? new Date(rel.published_at).toLocaleDateString("ja-JP") : '';
          const isSafeUrl = typeof downloadUrl === 'string' && /^https:\/\/(?:github\.com|objects\.githubusercontent\.com)\//i.test(downloadUrl);

          const div = document.createElement("div");
          div.className = "bg-dark-800 border border-white/5 rounded-lg p-2.5 flex items-center justify-between";
          div.innerHTML = `
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-gray-200">${escapeHtml(rel.tag_name)}</span>
                ${rel.prerelease ? `<span class="px-1 py-0.5 bg-amber-500/20 text-amber-500 text-[9px] rounded">Pre</span>` : ''}
              </div>
              <p class="text-[10px] text-gray-500 mt-0.5">${escapeHtml(pubDate)} ${exeAsset ? `• ${(exeAsset.size / (1024*1024)).toFixed(1)}MB` : ''}</p>
            </div>
            <button ${!isSafeUrl ? 'disabled' : ''} id="btn-install-${escapeHtml(rel.tag_name)}" class="past-rel-btn px-3 py-1.5 bg-dark-700 hover:bg-dark-900 border border-white/5 disabled:opacity-50 text-gray-200 text-xs rounded-md shadow transition-colors flex items-center gap-1.5 flex-shrink-0">
              インストール
            </button>
          `;
          if (isSafeUrl) {
            const btn = div.querySelector('.past-rel-btn');
            if (btn) {
              btn.addEventListener('click', () => installPastVersion(downloadUrl, rel.tag_name));
            }
          }
          container.appendChild(div);
        });
      } catch (e) {
        logMessage(`Fetch error: ${e.message || e}`, true);
        if (releasesPage === 1) {
          container.innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">取得失敗</div>`;
        }
      } finally {
        loader.classList.add("hidden");
        loader.classList.remove("flex");
        releasesLoading = false;
      }
    }

    async function installPastVersion(url, tag) {
      if (!url || url === 'null') return;
      localStorage.setItem('covo_ignore_force_update', '1');
      const btn = document.getElementById(`btn-install-${tag}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
      }
      logMessage(`Downloading ${tag}... (バージョンロック有効化)`);

      try {
        if (!invoke) throw new Error("Tauri API missing.");
        await invoke('silent_install_past_version', { url: url, tag: tag });
        logMessage(`Installing ${tag}...`);
        if (btn) btn.innerHTML = `復旧中...`;
      } catch (err) {
        logMessage(`Install error: ${err.message || err}`, true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `失敗`;
        }
      }
    }

    if (listen) {
      listen('download-progress', (event) => {
        const data = event.payload;
        if (data) {
          const btn = document.getElementById(`btn-install-${data.tag}`);
          if (btn) btn.innerHTML = `${data.progress}%`;
          logMessage(`[${data.tag}] ${data.progress}%`);
        }
      });
    }
    // 起動時に自動で裏で最新アップデートを照合・ダウンロード（操作不能時の自動救済）
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        triggerUpdateCheck(true);
      }, 1200);
    });
    </script>
</body>
